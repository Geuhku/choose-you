<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Gen 5 Experience</title>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">

<style>
*{margin:0;padding:0;box-sizing:border-box}
body{
  background:black;
  font-family:'Press Start 2P', cursive;
  color:white;
  overflow:hidden;
}

/* Split backgrounds */
.split{
  position:fixed;
  top:0;bottom:0;
  width:50%;
}
.left{left:0;background:#0a1535;}
.right{right:0;background:#3a0000;}
.split img{
  position:absolute;
  width:60%;
  left:50%;
  top:50%;
  transform:translate(-50%,-50%);
}

/* Lightning */
.lightning{
  position:absolute;
  width:3px;
  height:100%;
  background:rgba(255,255,255,0.4);
  animation:flash 2s infinite;
}
@keyframes flash{
  0%,90%,100%{opacity:0}
  95%{opacity:1}
}

/* Fire */
.fire{
  position:absolute;
  bottom:0;
  width:6px;
  height:6px;
  background:orange;
  border-radius:50%;
  animation:rise 3s linear infinite;
}
@keyframes rise{
  from{transform:translateY(0);opacity:1}
  to{transform:translateY(-300px);opacity:0}
}

/* Battle box */
.battle-box{
  position:fixed;
  bottom:5%;
  left:50%;
  transform:translateX(-50%);
  width:90%;
  max-width:900px;
  background:black;
  border:4px solid white;
  padding:25px;
  font-size:12px;
  display:flex;
  justify-content:space-between;
}

/* Buttons */
button{
  font-family:'Press Start 2P';
  font-size:10px;
  padding:10px;
  border:3px solid white;
  background:black;
  color:white;
  cursor:pointer;
}
button:hover{
  background:white;
  color:black;
}

/* Pokeball */
#pokeball{
  display:none;
  position:fixed;
  top:40%;
  left:50%;
  transform:translate(-50%,-50%);
  width:100px;
}

/* Fade */
#fade{
  position:fixed;
  inset:0;
  background:white;
  opacity:0;
  transition:0.6s;
  pointer-events:none;
}

/* Saving */
#saving{
  display:none;
  position:fixed;
  inset:0;
  background:black;
  color:white;
  justify-content:center;
  align-items:center;
  flex-direction:column;
  font-size:12px;
}

/* Pokedex */
#pokedex{
  display:none;
  position:fixed;
  inset:0;
  background:#cc0000;
  padding:40px;
}
.dex-header{
  border-bottom:3px solid white;
  padding-bottom:10px;
  margin-bottom:20px;
}
.dex-entry{
  font-size:10px;
  line-height:1.6;
}
</style>
</head>

<body>

<div class="split left"><img src="zekrom.png"></div>
<div class="split right"><img src="reshiram.png"></div>

<div id="fade"></div>

<div class="battle-box">
  <p id="dialogue"></p>
  <div>
    <button onclick="sayYes()">YES</button>
    <button id="noBtn" onmouseover="moveButton()">NO</button>
  </div>
</div>

<div id="pokeball">
<svg viewBox="0 0 100 100">
  <circle cx="50" cy="50" r="48" fill="white" stroke="black" stroke-width="4"/>
  <path d="M2 50 A48 48 0 0 1 98 50" fill="red"/>
  <circle cx="50" cy="50" r="14" fill="white" stroke="black" stroke-width="4"/>
</svg>
</div>

<div id="saving"></div>

<div id="pokedex">
  <div class="dex-header">POKÉDEX ENTRY REGISTERED</div>
  <div class="dex-entry" id="dexText"></div>
  <br><br>
  <button onclick="location.reload()">CLOSE</button>
</div>

<script>
let girlName="Blank";
let text=`In a world divided by Truth and Ideals... ${girlName}, will you stand with me?`;
let i=0;
let capturing=false;

const dialogue=document.getElementById("dialogue");
const pokeball=document.getElementById("pokeball");
const fade=document.getElementById("fade");
const saving=document.getElementById("saving");
const pokedex=document.getElementById("pokedex");

typeWriter();
createLightning();
createFire();

function typeWriter(){
  if(i<text.length){
    dialogue.innerHTML+=text.charAt(i);
    i++;
    setTimeout(typeWriter,40);
  }
}

function sayYes(){
  if(capturing) return;
  capturing=true;
  pokeball.style.display="block";
  setTimeout(()=>fadeToWhite(),1000);
}

function fadeToWhite(){
  fade.style.opacity=1;
  setTimeout(()=>{
    fade.style.opacity=0;
    showSaving();
  },600);
}

function showSaving(){
  saving.style.display="flex";
  saving.innerHTML="<p>Saving...<br>Don't turn off the power.</p>";
  setTimeout(()=>{
    saving.style.display="none";
    showDex();
  },4000);
}

function showDex(){
  pokedex.style.display="block";
  document.getElementById("dexText").innerHTML=
    `${girlName}<br><br>
     The Legendary Partner Pokémon.<br>
     Appears when Truth and Ideals align.`;
}

function moveButton(){
  if(capturing) return;
  const btn=document.getElementById("noBtn");
  btn.style.position="absolute";
  btn.style.left=Math.random()*400+"px";
  btn.style.top=Math.random()*200+"px";
}

function createLightning(){
  const bolt=document.createElement("div");
  bolt.className="lightning";
  bolt.style.left=Math.random()*200+"px";
  document.querySelector(".left").appendChild(bolt);
  setTimeout(()=>bolt.remove(),2000);
  setTimeout(createLightning,3000);
}

function createFire(){
  const ember=document.createElement("div");
  ember.className="fire";
  ember.style.left=Math.random()*200+"px";
  document.querySelector(".right").appendChild(ember);
  setTimeout(()=>ember.remove(),3000);
  setTimeout(createFire,500);
}
</script>

</body>
</html>
