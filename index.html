<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Gen 5 Experience</title>

<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">

<style>
*{margin:0;padding:0;box-sizing:border-box}
body{
  background:#222;
  font-family:'Press Start 2P', cursive;
  overflow:hidden;
}

/* ===== DS FRAME ===== */
.ds-frame{
  position:absolute;
  width:420px;
  height:760px;
  left:50%;
  top:50%;
  transform:translate(-50%,-50%);
  background:#111;
  border-radius:40px;
  box-shadow:0 0 40px black;
  padding:20px;
}

.screen{
  width:100%;
  height:320px;
  background:black;
  border-radius:15px;
  position:relative;
  overflow:hidden;
  border:5px solid #333;
}

/* Hinge */
.hinge{
  height:40px;
  background:#000;
  margin:15px 0;
  border-radius:10px;
}

/* ===== Backgrounds ===== */
.split{
  position:absolute;
  top:0;bottom:0;
  width:50%;
}
.left{left:0;background:#0a1535;}
.right{right:0;background:#3a0000;}
.split img{
  position:absolute;
  width:70%;
  left:50%;
  top:50%;
  transform:translate(-50%,-50%);
}

/* Lightning */
.lightning{
  position:absolute;
  width:3px;
  height:100%;
  background:rgba(255,255,255,0.4);
  animation:flash 2s infinite;
}
@keyframes flash{
  0%,90%,100%{opacity:0}
  95%{opacity:1}
}

/* Fire particles */
.fire{
  position:absolute;
  bottom:0;
  width:6px;
  height:6px;
  background:orange;
  border-radius:50%;
  animation:rise 3s linear infinite;
}
@keyframes rise{
  from{transform:translateY(0);opacity:1}
  to{transform:translateY(-200px);opacity:0}
}

/* ===== Battle Text Box ===== */
.battle-box{
  position:absolute;
  bottom:10px;
  left:50%;
  transform:translateX(-50%);
  width:95%;
  background:black;
  border:4px solid white;
  padding:15px;
  font-size:10px;
  color:white;
  display:flex;
  justify-content:space-between;
}

/* Buttons */
button{
  font-family:'Press Start 2P';
  font-size:9px;
  padding:8px;
  background:black;
  color:white;
  border:2px solid white;
  cursor:pointer;
}
button:hover{
  background:white;
  color:black;
}

/* Pokeball */
#pokeball{
  display:none;
  position:absolute;
  top:40%;
  left:50%;
  transform:translate(-50%,-50%);
  width:80px;
}

/* Fade */
#fade{
  position:absolute;
  inset:0;
  background:white;
  opacity:0;
  transition:0.6s;
  pointer-events:none;
}

/* ===== Saving ===== */
#saving{
  display:none;
  position:absolute;
  inset:0;
  background:black;
  color:white;
  justify-content:center;
  align-items:center;
  flex-direction:column;
  font-size:10px;
}

/* ===== Pokédex (Black/White style) ===== */
#pokedex{
  display:none;
  position:absolute;
  inset:0;
  background:#cc0000;
  color:white;
  padding:20px;
  font-size:10px;
}

.dex-header{
  border-bottom:3px solid white;
  padding-bottom:10px;
  margin-bottom:15px;
}

.dex-body{
  display:flex;
  gap:15px;
}

.dex-entry{
  font-size:8px;
  line-height:1.6;
}

/* Scanlines */
.screen::after{
  content:"";
  position:absolute;
  inset:0;
  background:repeating-linear-gradient(
    to bottom,
    rgba(255,255,255,0.03),
    rgba(255,255,255,0.03) 1px,
    transparent 1px,
    transparent 3px
  );
  pointer-events:none;
}
</style>
</head>

<body>

<div class="ds-frame">

  <!-- TOP SCREEN -->
  <div class="screen" id="topScreen">
    <div class="split left">
      <img src="zekrom.png">
    </div>
    <div class="split right">
      <img src="reshiram.png">
    </div>

    <div id="fade"></div>

    <div id="pokeball">
      <svg viewBox="0 0 100 100">
        <circle cx="50" cy="50" r="48" fill="white" stroke="black" stroke-width="4"/>
        <path d="M2 50 A48 48 0 0 1 98 50" fill="red"/>
        <circle cx="50" cy="50" r="14" fill="white" stroke="black" stroke-width="4"/>
        <circle cx="50" cy="50" r="6" fill="#ccc"/>
      </svg>
    </div>
  </div>

  <div class="hinge"></div>

  <!-- BOTTOM SCREEN -->
  <div class="screen" id="bottomScreen">

    <div class="battle-box">
      <p id="dialogue"></p>
      <div>
        <button onclick="sayYes()">YES</button>
        <button id="noBtn" onmouseover="moveButton()">NO</button>
      </div>
    </div>

    <div id="saving"></div>

    <div id="pokedex">
      <div class="dex-header">POKéDEX ENTRY REGISTERED</div>
      <div class="dex-body">
        <div>
          <svg width="80" viewBox="0 0 100 100">
            <circle cx="50" cy="50" r="48" fill="white" stroke="black" stroke-width="4"/>
            <path d="M2 50 A48 48 0 0 1 98 50" fill="red"/>
          </svg>
        </div>
        <div class="dex-entry" id="dexText"></div>
      </div>
      <br>
      <button onclick="location.reload()">CLOSE</button>
    </div>

  </div>
</div>

<script>
let girlName="Joey";
let text=`In a world divided by Truth and Ideals... ${girlName}, will you stand with me?`;
let i=0;
let capturing=false;

const dialogue=document.getElementById("dialogue");
const pokeball=document.getElementById("pokeball");
const fade=document.getElementById("fade");
const saving=document.getElementById("saving");
const pokedex=document.getElementById("pokedex");

typeWriter();
createLightning();
createFire();

/* Typewriter */
function typeWriter(){
  if(i<text.length){
    dialogue.innerHTML+=text.charAt(i);
    i++;
    setTimeout(typeWriter,40);
  }
}

/* Capture */
function sayYes(){
  if(capturing) return;
  capturing=true;
  pokeball.style.display="block";
  pokeball.style.animation="drop 0.6s forwards";
  setTimeout(()=>fadeToWhite(),1200);
}

function fadeToWhite(){
  fade.style.opacity=1;
  setTimeout(()=>{
    fade.style.opacity=0;
    showSaving();
  },600);
}

function showSaving(){
  saving.style.display="flex";
  saving.innerHTML="<p>Saving...<br>Don't turn off the power.</p>";

  setTimeout(()=>{
    saving.style.display="none";
    showDex();
  },4000);
}

function showDex(){
  pokedex.style.display="block";
  document.getElementById("dexText").innerHTML=
    `${girlName}<br><br>
     The Legendary Partner Pokémon.<br>
     Said to appear when Truth and Ideals are in balance.`;
}

/* No button dodge */
function moveButton(){
  if(capturing) return;
  const btn=document.getElementById("noBtn");
  btn.style.position="absolute";
  btn.style.left=Math.random()*250+"px";
  btn.style.top=Math.random()*200+"px";
}

/* Lightning */
function createLightning(){
  const bolt=document.createElement("div");
  bolt.className="lightning";
  bolt.style.left=Math.random()*150+"px";
  document.querySelector(".left").appendChild(bolt);
  setTimeout(()=>bolt.remove(),2000);
  setTimeout(createLightning,3000);
}

/* Fire */
function createFire(){
  const ember=document.createElement("div");
  ember.className="fire";
  ember.style.left=Math.random()*150+"px";
  document.querySelector(".right").appendChild(ember);
  setTimeout(()=>ember.remove(),3000);
  setTimeout(createFire,500);
}
</script>

</body>
</html>
