<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Can I Choose You?</title>

<style>
* { box-sizing: border-box; margin:0; padding:0; }
body {
  font-family: Arial, sans-serif;
  background:#111;
  color:white;
  overflow:hidden;
}

/* Intro */
#intro {
  position:fixed;
  inset:0;
  display:flex;
  flex-direction:column;
  justify-content:center;
  align-items:center;
  background:black;
  z-index:100;
}
#intro button {
  padding:12px 20px;
  margin-top:20px;
  border:none;
  border-radius:10px;
  background:crimson;
  color:white;
  cursor:pointer;
}

/* Split Background */
.split {
  position:fixed;
  top:0;
  bottom:0;
  width:50%;
  display:flex;
  align-items:center;
  justify-content:center;
}
.left { left:0; background:#0a0f2b; }
.right { right:0; background:#2b0000; }
.split img { max-width:60%; }

/* Battle Box */
.battle-box {
  position:fixed;
  bottom:10%;
  left:50%;
  transform:translateX(-50%);
  width:90%;
  max-width:700px;
  background:rgba(0,0,0,0.8);
  padding:20px;
  border-radius:12px;
  display:flex;
  justify-content:space-between;
  align-items:center;
}
.buttons button {
  padding:10px 14px;
  border-radius:10px;
  border:none;
  cursor:pointer;
}
.yes { background:crimson; color:white; }
.no { background:transparent; color:white; border:1px solid white; }

/* Pokeball */
#pokeball {
  display:none;
  position:fixed;
  top:40%;
  left:50%;
  transform:translate(-50%,-50%);
  width:120px;
  height:120px;
  border-radius:50%;
  background:linear-gradient(red 50%, white 50%);
  border:6px solid black;
  z-index:50;
}

/* Saving Screen */
#saving {
  display:none;
  position:fixed;
  inset:0;
  background:black;
  color:white;
  justify-content:center;
  align-items:center;
  flex-direction:column;
  font-size:22px;
  z-index:200;
}

/* Pokedex */
#pokedex {
  display:none;
  position:fixed;
  inset:0;
  background:crimson;
  color:white;
  justify-content:center;
  align-items:center;
  flex-direction:column;
  font-size:22px;
  z-index:300;
}

/* Animations */
@keyframes drop {
  from { top:-150px; opacity:0; }
  to { top:40%; opacity:1; }
}
@keyframes shake {
  0% { transform:translate(-50%,-50%) rotate(0); }
  25% { transform:translate(-55%,-50%) rotate(-15deg); }
  50% { transform:translate(-45%,-50%) rotate(15deg); }
  75% { transform:translate(-55%,-50%) rotate(-10deg); }
  100% { transform:translate(-50%,-50%) rotate(0); }
}
.shake { animation:shake 0.5s; }
</style>
</head>

<body>

<div id="intro">
  <h1>In a world of Truth and Ideals...</h1>
  <button onclick="startExperience()">Begin</button>
</div>

<audio id="bg-music" loop>
  <source src="unova-theme.mp3" type="audio/mp3">
</audio>

<div class="split left">
  <img src="zekrom.png">
</div>
<div class="split right">
  <img src="reshiram.png">
</div>

<div class="battle-box">
  <p id="dialogue"></p>
  <div class="buttons">
    <button class="yes" onclick="sayYes()">Yes ❤️</button>
    <button class="no" onmouseover="moveButton()" onclick="tryNo()">No</button>
  </div>
</div>

<div id="pokeball"></div>

<div id="saving"></div>

<div id="pokedex">
  <h1>New Relationship Registered!</h1>
  <p id="pokedex-name"></p>
  <button onclick="resetExperience()">Play Again</button>
</div>

<script>
let girlName = "_blank";
let text = `In a world of Truth and Ideals... I found someone legendary. ${girlName}... can I choose you? ❤️`;
let i = 0;
let speed = 40;
let capturing = false;

const dialogueEl = document.getElementById("dialogue");
const introEl = document.getElementById("intro");
const bgMusic = document.getElementById("bg-music");
const pokeballEl = document.getElementById("pokeball");
const savingEl = document.getElementById("saving");
const pokedexEl = document.getElementById("pokedex");
const pokedexNameEl = document.getElementById("pokedex-name");
const yesBtn = document.querySelector(".yes");
const noBtn = document.querySelector(".no");

function startExperience() {
  introEl.style.display="none";
  bgMusic.play().catch(()=>{});
  typeWriter();
}

function typeWriter(){
  if(i < text.length){
    dialogueEl.innerHTML += text.charAt(i);
    i++;
    setTimeout(typeWriter, speed);
  }
}

function sayYes(){
  if(capturing) return;
  capturing = true;
  yesBtn.disabled = true;
  noBtn.disabled = true;

  pokeballEl.style.display="block";
  pokeballEl.style.animation="drop 1s forwards";
  setTimeout(()=>shakeBall(1),1200);
}

function shakeBall(count){
  if(count <=3){
    pokeballEl.classList.add("shake");
    setTimeout(()=>{
      pokeballEl.classList.remove("shake");
      setTimeout(()=>shakeBall(count+1),200);
    },500);
  } else {
    showSaving();
  }
}

function showSaving(){
  savingEl.style.display="flex";
  savingEl.innerHTML="<p id='savingText'>Saving...<br>Don't turn off the power.</p>";

  let dots=0;
  const savingText=document.getElementById("savingText");

  const interval=setInterval(()=>{
    dots=(dots+1)%4;
    savingText.innerHTML=`Saving${".".repeat(dots)}<br>Don't turn off the power.`;
  },500);

  setTimeout(()=>{
    clearInterval(interval);
    savingEl.innerHTML=`<p>Saving complete!<br>${girlName} was saved successfully! 💖</p>`;
  },4000);

  setTimeout(()=>{
    savingEl.style.display="none";
    showPokedex();
  },6000);
}

function showPokedex(){
  pokedexNameEl.innerText=`${girlName} has been added to your Pokédex. 💖`;
  pokedexEl.style.display="flex";
}

function moveButton(){
  if(capturing) return;
  const bw=noBtn.offsetWidth;
  const bh=noBtn.offsetHeight;
  const left=Math.random()*(window.innerWidth-bw);
  const top=Math.random()*(window.innerHeight-bh);
  noBtn.style.position="absolute";
  noBtn.style.left=left+"px";
  noBtn.style.top=top+"px";
}

function tryNo(){
  if(capturing) return;
  dialogueEl.innerHTML="You tried to refuse, but fate disagreed... 💫";
  setTimeout(()=>{
    noBtn.style.position="relative";
    noBtn.style.left="";
    noBtn.style.top="";
    dialogueEl.innerHTML=text;
  },1500);
}

function resetExperience(){
  pokedexEl.style.display="none";
  savingEl.style.display="none";
  pokeballEl.style.display="none";
  pokeballEl.style.animation="";
  dialogueEl.innerHTML="";
  i=0;
  capturing=false;
  yesBtn.disabled=false;
  noBtn.disabled=false;
  introEl.style.display="flex";
  bgMusic.pause();
  bgMusic.currentTime=0;
}
</script>

</body>

</html>
