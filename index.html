<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Can I Choose You?</title>

<style>
/* ========================= */
/* 🎯 POKEBALL SHAKE SYSTEM  */
/* ========================= */

/* Drop animation */
@keyframes drop {
    from { top: -150px; }
    to   { top: 40%; }
}

/* Shake animation (3 wiggles) */
@keyframes shake {
    0%   { transform: translateX(-50%) rotate(0deg); }
    25%  { transform: translateX(-55%) rotate(-10deg); }
    50%  { transform: translateX(-45%) rotate(10deg); }
    75%  { transform: translateX(-55%) rotate(-10deg); }
    100% { transform: translateX(-50%) rotate(0deg); }
}

.shake {
    animation: shake 0.5s ease;
}

/* ========================= */
/* ✨ CAPTURE FLASH EFFECT   */
/* ========================= */

@keyframes flashWhite {
    0%   { background: transparent; }
    50%  { background: white; }
    100% { background: transparent; }
}

.flash {
    animation: flashWhite 0.6s ease;
}

/* ========================= */
/* 📖 POKEDEX SCREEN         */
/* ========================= */

#pokedex {
    position: fixed;
    width: 100%;
    height: 100%;
    background: crimson;
    color: white;
    display: none;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    text-align: center;
    z-index: 50;
    font-size: 24px;
    padding: 20px;
}

/* ========================= */
/* 💎 EXTRA POLISH           */
/* ========================= */

/* Glowing Yes button pulse */
@keyframes pulse {
    0%   { box-shadow: 0 0 10px crimson; }
    50%  { box-shadow: 0 0 25px pink; }
    100% { box-shadow: 0 0 10px crimson; }
}

.yes {
    animation: pulse 2s infinite;
}

/* Additional styles for layout */
body {
    font-family: Arial, sans-serif;
    margin: 0;
    overflow-x: hidden;
    background: #000;
    color: #fff;
}

#intro {
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    height: 100vh;
    text-align: center;
    background: linear-gradient(to bottom, #111, #222);
}

.split {
    position: fixed;
    top: 0;
    width: 50%;
    height: 100%;
    overflow: hidden;
}

.split.left {
    left: 0;
    background: #001a33;
    display: flex;
    justify-content: center;
    align-items: center;
}

.split.right {
    right: 0;
    background: #330000;
    display: flex;
    justify-content: center;
    align-items: center;
}

.split img {
    max-width: 80%;
    max-height: 80%;
}

.battle-box {
    position: fixed;
    bottom: 10%;
    width: 100%;
    text-align: center;
    font-size: 20px;
}

.battle-box .buttons {
    margin-top: 20px;
}

.battle-box button {
    margin: 0 10px;
    padding: 10px 20px;
    font-size: 18px;
    cursor: pointer;
}

#pokeball {
    display: none;
    position: fixed;
    left: 50%;
    top: -150px;
    width: 80px;
    height: 80px;
    background: red;
    border-radius: 50%;
    border: 5px solid white;
    transform: translateX(-50%);
    z-index: 40;
}

#saving {
    display: none;
    position: fixed;
    top: 0;
    width: 100%;
    height: 100%;
    background: black;
    color: white;
    font-size: 28px;
    display: flex;
    justify-content: center;
    align-items: center;
    text-align: center;
    flex-direction: column;
    z-index: 45;
}
</style>
</head>

<body>

<!-- 🎬 Intro -->
<div id="intro">
    <h1>In a world divided by Truth and Ideals...</h1>
    <button onclick="startExperience()">Begin</button>
</div>

<audio id="bg-music" loop>
    <source src="unova-theme.mp3" type="audio/mp3">
</audio>

<!-- Split -->
<div class="split left">
    <div class="lightning"></div>
    <img src="zekrom.png" alt="Zekrom">
</div>

<div class="split right">
    <div class="fire"></div>
    <img src="reshiram.png" alt="Reshiram">
</div>

<!-- 🎮 Battle Box -->
<div class="battle-box">
    <p id="dialogue"></p>
    <div class="buttons">
        <button class="yes" onclick="sayYes()">Yes ❤️</button>
        <button class="no" onmouseover="moveButton()">No</button>
    </div>
</div>

<!-- ⚪ Pokéball -->
<div id="pokeball"></div>

<!-- 💾 Saving Screen -->
<div id="saving">
    <p>Saving...<br>Don't turn off the power.</p>
</div>

<div id="pokedex">
    <h1>New Relationship Registered!</h1>
    <p>Joey has been added to your Pokédex. 💖</p>
    <p>Status: Legendary Partner</p>
</div>

<script>
let girlName ="Joey";
let text = `In a world of Truth and Ideals...
I found someone legendary.

Joey... can I choose you? ❤️`;

let i = 0;
let speed = 40;

function startExperience() {
    document.getElementById("intro").style.display = "none";
    document.getElementById("bg-music").play();
    typeWriter();
}

function typeWriter() {
    if (i < text.length) {
        document.getElementById("dialogue").innerHTML += text.charAt(i);
        i++;
        setTimeout(typeWriter, speed);
    }
}

function sayYes() {
    let ball = document.getElementById("pokeball");
    ball.style.display = "block";
    ball.style.animation = "drop 1s forwards";

    // After drop, start shakes
    setTimeout(() => shakeBall(ball, 1), 1200);
}

function shakeBall(ball, count) {
    if (count <= 3) {
        ball.classList.add("shake");

        setTimeout(() => {
            ball.classList.remove("shake");
            setTimeout(() => shakeBall(ball, count + 1), 600);
        }, 500);

    } else {
        captureSuccess(ball);
    }
}

function captureSuccess(ball) {
    document.body.classList.add("flash");

    setTimeout(() => {
        document.body.classList.remove("flash");
        document.getElementById("saving").style.display = "flex";
    }, 600);

    setTimeout(() => {
        document.getElementById("saving").innerHTML =
        `Saving...<br>Joey was saved successfully! 💖`;
    }, 2500);

    setTimeout(() => {
        document.getElementById("saving").style.display = "none";
        document.getElementById("pokedex").style.display = "flex";
    }, 4500);
}

function moveButton() {
    const button = document.querySelector(".no");
    button.style.position = "absolute";
    button.style.left = Math.random() * window.innerWidth + "px";
    button.style.top = Math.random() * window.innerHeight + "px";
}
</script>

</body>
</html>
